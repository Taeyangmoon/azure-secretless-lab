name: CI

# 시크릿/Azure 로그인이 전혀 필요 없는 워크플로입니다. (권한: 읽기 전용)
on:
  pull_request:
    paths: ['app/**', '.github/workflows/ci.yml']
  push:
    branches-ignore: [main]
    paths: ['app/**', '.github/workflows/ci.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Docker 이미지 빌드 검증 (push 하지 않음)
        run: docker build -t secretless-app:ci .
