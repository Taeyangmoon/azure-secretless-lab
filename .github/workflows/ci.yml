name: CI

# This workflow needs no secrets and no Azure login. (Permissions: read-only)
on:
  pull_request:
    paths: ['app/**', '.github/workflows/ci.yml']
  push:
    branches-ignore: [main]
    paths: ['app/**', '.github/workflows/ci.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Verify the Docker image builds (no push)
        run: docker build -t secretless-app:ci .
