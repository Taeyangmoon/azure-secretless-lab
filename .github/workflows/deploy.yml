name: Deploy to Azure

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

# The id-token: write permission is required to request an OIDC token.
permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Must match the Federated Credential subject (repo:<owner>/<repo>:environment:prod) to log in.
    environment: prod
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # Passwordless login: exchange the GitHub OIDC token for a Microsoft Entra ID token.
      # These 3 values are not secrets, so we use vars (variables) instead of secrets.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build & push image (ACR Tasks)
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "secretless-app:${IMAGE_TAG}" \
            --image "secretless-app:latest" \
            ./app

      - name: Deploy to Container Apps
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt extension.dynamic_install_allow_preview=true
          ACR_SERVER="$(az acr show -n '${{ vars.ACR_NAME }}' --query loginServer -o tsv)"

          # Switch to the app port (3000). The initial placeholder image uses port 80.
          az containerapp ingress update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --target-port 3000

          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${ACR_SERVER}/secretless-app:${IMAGE_TAG}" \
            --set-env-vars "APP_VERSION=${IMAGE_TAG::7}"

      - name: Smoke test
        run: |
          URL="https://$(az containerapp show \
            --name '${{ vars.CONTAINER_APP_NAME }}' \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --query properties.configuration.ingress.fqdn -o tsv)"
          echo "URL: $URL"
          for i in $(seq 1 20); do
            if curl -fsS "$URL/health"; then
              echo; curl -fsS "$URL/api/info"; echo
              echo "### 🚀 Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting... ($i/20)"; sleep 10
          done
          echo "Smoke test failed"; exit 1
